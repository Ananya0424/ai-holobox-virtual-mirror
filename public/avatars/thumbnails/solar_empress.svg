<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.95"/>
      <stop offset="52%" stop-color="#271908"/>
      <stop offset="100%" stop-color="#090704"/>
    </radialGradient>
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="48%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="240" height="300" rx="18" fill="url(#bg)"/>
  <!-- Floating Sun Halo Behind Head -->
  <g filter="url(#glow)">
    <circle cx="114" cy="68" r="38" fill="none" stroke="#fde047" stroke-width="2.5" opacity="0.85"/>
    <circle cx="114" cy="68" r="46" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.7"/>
    <polygon points="114,16 118,28 110,28" fill="#fef08a"/>
    <polygon points="62,68 74,64 74,72" fill="#fef08a"/>
    <polygon points="166,68 154,64 154,72" fill="#fef08a"/>
    <polygon points="78,32 88,38 82,44" fill="#fde047"/>
    <polygon points="150,32 140,38 146,44" fill="#fde047"/>
  </g>
  <!-- Golden Sun Staff -->
  <rect x="180" y="74" width="6" height="184" rx="3" fill="url(#solar)"/>
  <g filter="url(#glow)">
    <circle cx="183" cy="60" r="15" fill="none" stroke="#fef08a" stroke-width="3"/>
    <circle cx="183" cy="60" r="7" fill="#fef9c3"/>
  </g>
  <!-- Celestial Crown & Elegant Golden Armour -->
  <path d="M114,48 C101,48 96,60 98,76 L114,84 L130,76 C132,60 127,48 114,48 Z" fill="url(#solar)"/>
  <polygon points="100,52 106,38 114,48 122,38 128,52" fill="#fef08a" filter="url(#glow)"/>
  <path d="M84,90 C96,82 132,82 144,90 L156,120 L138,128 L148,256 L80,256 L90,128 L72,120 Z" fill="url(#solar)" stroke="#fef9c3" stroke-width="1.6"/>
  <path d="M104,96 L124,96 L118,162 L110,162 Z" fill="#fef9c3" opacity="0.8"/>
  <!-- Arm Holding Sun Staff -->
  <path d="M144,116 L180,148 L172,158 L136,128 Z" fill="url(#solar)" stroke="#fef9c3" stroke-width="1.3"/>
  <circle cx="48" cy="144" r="3" fill="#fef08a" filter="url(#glow)"/>
  <circle cx="66" cy="204" r="2.5" fill="#facc15" filter="url(#glow)"/>
  <ellipse cx="114" cy="264" rx="60" ry="8" fill="#facc15" opacity="0.32"/>
