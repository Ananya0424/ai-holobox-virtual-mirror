<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#9a3412" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#090707"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="60%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="240" height="300" rx="18" fill="url(#bg)"/>
  <!-- Phoenix Fire Wings Aura -->
  <path d="M112,135 C72,115 36,78 28,46 C54,66 78,80 105,98 Z" fill="url(#flame)" opacity="0.45" filter="url(#glow)"/>
  <path d="M122,135 C162,115 198,78 206,46 C180,66 156,80 129,98 Z" fill="url(#flame)" opacity="0.45" filter="url(#glow)"/>
  <!-- Flaming Magical Staff -->
  <rect x="178" y="82" width="7" height="176" rx="3" fill="url(#gold)"/>
  <g filter="url(#glow)">
    <path d="M181,34 C194,50 198,68 181,84 C164,68 168,50 181,34 Z" fill="url(#flame)"/>
    <circle cx="181" cy="64" r="7" fill="#fef9c3"/>
  </g>
  <!-- Hooded Mage & Black/Orange/Gold Robes -->
  <path d="M114,44 C94,46 88,64 92,84 L136,84 C140,64 134,46 114,44 Z" fill="#1c1917" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="107" cy="68" r="2.8" fill="#fb923c" filter="url(#glow)"/>
  <circle cx="121" cy="68" r="2.8" fill="#fb923c" filter="url(#glow)"/>
  <path d="M82,88 L146,88 L162,130 L144,136 L154,256 L74,256 L84,136 L66,130 Z" fill="url(#robe)" stroke="url(#gold)" stroke-width="2"/>
  <path d="M104,90 L124,90 L130,256 L98,256 Z" fill="#ea580c" opacity="0.65"/>
  <polygon points="114,104 126,122 114,142 102,122" fill="url(#gold)"/>
  <!-- Arm Holding Staff -->
  <path d="M148,118 L178,154 L170,164 L138,132 Z" fill="#292524" stroke="url(#gold)" stroke-width="1.5"/>
  <!-- Floating Embers -->
  <circle cx="52" cy="186" r="3" fill="#fb923c" filter="url(#glow)"/>
  <circle cx="198" cy="144" r="3" fill="#fde047" filter="url(#glow)"/>
  <circle cx="62" cy="112" r="2.5" fill="#f97316" filter="url(#glow)"/>
  <ellipse cx="114" cy="264" rx="62" ry="8" fill="#f97316" opacity="0.32"/>
</svg>
